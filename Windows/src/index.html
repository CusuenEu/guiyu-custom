<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <title>归屿</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <div class="brand">
            <img src="../assets/companion.png" alt="归屿小鸡" /><span
              >归屿</span
            >
          </div>
          <label class="search"
            ><span class="search-icon" aria-hidden="true"></span
            ><input
              id="query"
              placeholder="搜索项目或文件"
              aria-label="搜索项目或文件"
            /><button id="clear-query" aria-label="清除搜索">×</button></label
          >
        </header>
        <div id="rail-sections">
          <section id="directory-section">
            <div class="rail-heading">
              项目目录<button id="add-root" aria-label="关联项目总目录">
                ＋
              </button>
            </div>
            <nav id="directories" aria-label="项目目录"></nav>
          </section>
          <div
            id="rail-divider"
            role="separator"
            tabindex="0"
            aria-label="调整目录区域高度"
            aria-orientation="horizontal"
          ></div>
          <section id="source-section">
            <div class="rail-heading">
              可归档目录<button id="add-source" aria-label="关联可归档目录">
                ＋
              </button>
            </div>
            <nav id="sources" aria-label="可归档目录"></nav>
          </section>
        </div>
        <button id="settings" class="settings-button">
          ⚙ <span>设置</span>
        </button>
      </aside>
      <div
        class="column-divider"
        id="left-divider"
        role="separator"
        tabindex="0"
        aria-label="调整侧栏宽度"
      ></div>
      <main id="projects-pane">
        <div class="toolbar">
          <button id="refresh">⟳ &nbsp;刷新</button
          ><select id="sort" aria-label="项目排序">
            <option>月份倒序</option>
            <option>最近修改</option>
          </select>
        </div>
        <div id="source-subnav" class="source-subnav"></div>
        <div id="projects" role="listbox" aria-label="项目" tabindex="0"></div>
      </main>
      <div
        class="column-divider"
        id="right-divider"
        role="separator"
        tabindex="0"
        aria-label="调整项目栏宽度"
      ></div>
      <section id="files-pane" aria-label="项目文件">
        <div class="toolbar file-toolbar">
          <div class="segments" role="tablist" aria-label="展示模式">
            <button role="tab" data-mode="按类别" aria-selected="true">
              按类别</button
            ><button role="tab" data-mode="按时间">按时间</button
            ><button role="tab" data-mode="源文档">源文档</button>
          </div>
        </div>
        <div id="subnav"></div>
        <div id="batch-tools" hidden>
          <span id="selected-count"></span><button id="select-all">全选</button
          ><button id="deselect">取消选择</button
          ><button id="batch-menu">批量操作⌄</button>
        </div>
        <div
          id="files"
          role="listbox"
          aria-label="文件"
          aria-multiselectable="true"
          tabindex="0"
        ></div>
        <footer>
          <span><i></i><span id="status">本地工作空间</span></span
          ><span id="count"></span>
        </footer>
      </section>
    </div>
    <div id="context" role="menu" hidden></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status" hidden></div>
    <script src="naming-format.cjs"></script>
    <script src="navigation.cjs"></script>
    <script src="rail-order.cjs"></script>
    <script src="ui.cjs"></script>
  </body>
</html>
