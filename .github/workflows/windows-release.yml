name: Publish Windows
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows validation run for the current commit
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify build provenance
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > /tmp/build-run.json
          node - <<'JS'
          const r=require('/tmp/build-run.json');
          if(r.conclusion!=='success'||r.head_sha!==process.env.GITHUB_SHA||r.head_branch!=='main'||r.path!=='.github/workflows/windows.yml') throw Error('Expected a successful Windows validation of this exact main commit');
          JS
      - uses: actions/download-artifact@v4
        with:
          name: Guiyu-Windows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Verify artifact names and prepare metadata
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const v=require('./Windows/version.json');
          const {metadata}=require('./Windows/scripts/version.cjs');
          const expected=metadata(v);
          if(v.display!==expected.display||v.assetPrefix!==expected.assetPrefix) throw Error('Version metadata mismatch');
          const files=fs.readdirSync('release-assets').sort();
          const wanted=['ia32','x64'].flatMap(a=>[`${v.assetPrefix}-Windows-${a}.zip`,`${v.assetPrefix}-Windows-${a}-setup.exe`]).sort();
          if(JSON.stringify(files)!==JSON.stringify(wanted)||files.some(f=>!fs.statSync('release-assets/'+f).size)) throw Error('Unexpected Windows artifacts');
          fs.appendFileSync(process.env.GITHUB_ENV,`RELEASE_TAG=windows-${v.date}-${String(v.sequence).padStart(2,'0')}\nRELEASE_TITLE=归屿 ${v.display} Windows\n`);
          JS
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish Windows release
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title "$RELEASE_TITLE" --notes-file Windows/RELEASE-NOTES.md release-assets/*
          gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' | xargs -I{} test '{}' = '5'
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=false
