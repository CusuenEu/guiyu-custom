name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [custom]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and self-tests
        run: ./build.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/归屿.app
      - name: Package installer
        run: |
          cd dist
          ditto -c -k --keepParent 归屿.app guiyu-custom-macOS-arm64.zip
          shasum -a 256 guiyu-custom-macOS-arm64.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: guiyu-custom-macos
          path: |
            dist/guiyu-custom-macOS-arm64.zip
            dist/SHA256SUMS.txt
      - name: Generate changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "# 归屿定制版 更新日志"
            echo ""
            echo "构建时间：$(date -u '+%F %H:%M') UTC · 提交：${GITHUB_SHA::7}"
            echo ""
            if [ -n "$PREV" ]; then
              echo "## 相对上一版（${PREV}）的变更"
              git log --pretty=format:'- %s (%h)' "${PREV}..HEAD"
            else
              echo "## 本次构建包含的提交"
              git log --pretty=format:'- %s (%h)' -20
            fi
            echo ""
            echo ""
            echo "---"
            echo "基于 tiduse1988/guiyu（原作者 tiduse1988，MIT License）。安装：解压 zip 后把 归屿.app 拖入「应用程序」，首次打开在 系统设置→隐私与安全性→仍要打开。"
          } > dist/changelog.md
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="custom-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            dist/guiyu-custom-macOS-arm64.zip dist/SHA256SUMS.txt dist/changelog.md \
            --latest \
            --title "归屿定制版 ${TAG#custom-}" \
            --notes-file dist/changelog.md
