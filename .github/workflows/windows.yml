name: Windows validation
on:
  workflow_dispatch:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
jobs:
  core:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        node-arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.node-arch }}
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - run: npm ci --omit=optional --ignore-scripts
        working-directory: Windows
      - run: npm test
        working-directory: Windows
      - name: Parse Windows integration scripts
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          foreach($script in Get-ChildItem Windows/scripts/*.ps1){
            [System.Management.Automation.Language.Parser]::ParseInput((Get-Content -LiteralPath $script.FullName -Raw -Encoding UTF8),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){ $errors | Format-List; exit 1 }
          }
  package:
    runs-on: windows-2022
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - run: npm ci --omit=optional --ignore-scripts
        working-directory: Windows
      - name: Find or install NSIS
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { choco install nsis --no-progress -y; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if (!(Test-Path $nsis)) { throw 'NSIS was not installed' }
          "GUIYU_MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run package
        working-directory: Windows
      - name: Verify installer integration
        id: installer
        shell: pwsh
        run: ./Windows/tests/installer-smoke.ps1
      - name: Packaged workspace regression (ia32 and x64)
        run: node Windows/tests/workspace-native.cjs
      - name: Automatic update installation and restart (ia32 and x64)
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: node Windows/tests/update-native.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Guiyu-Windows
          path: |
            Windows/out/*.zip
            Windows/out/*-setup.exe

