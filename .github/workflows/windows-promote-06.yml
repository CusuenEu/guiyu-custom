name: Promote Windows 06 to formal release
on:
  push:
    paths: ['.github/workflows/windows-promote-06.yml']
permissions:
  contents: write
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: windows-20261102-06
    steps:
      - name: Verify existing Windows 06 and retain validation disclosure
        run: |
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > /tmp/release.json
          node - <<'JS'
          const fs=require('node:fs'),r=require('/tmp/release.json');
          const wanted=['Guiyu-20261102-06-Windows-ia32-setup.exe','Guiyu-20261102-06-Windows-ia32.zip','Guiyu-20261102-06-Windows-x64-setup.exe','Guiyu-20261102-06-Windows-x64.zip','SHA256SUMS.txt'].sort();
          if(r.draft||r.tag_name!=='windows-20261102-06'||r.target_commitish!=='7c94a1fca5217d9b53a1353c956415dad90bc863')throw Error('Unexpected Windows release');
          if(JSON.stringify(r.assets.map(a=>a.name).sort())!==JSON.stringify(wanted)||r.assets.some(a=>a.state!=='uploaded'||a.size<=0))throw Error('Expected all four Windows packages and checksum file');
          let body=r.body;
          body=body.replace('本次按用户要求提供全部 Windows 独立下载包，用于测试上述改动。发行页会注明该提交的完整 Windows 回归结果；若完整回归未通过，标为预发布，不代替稳定版。每个 EXE／ZIP 单独下载，不使用 Actions 的四合一下载包。','按用户要求，Windows 20261102(06) 的四个包均正式发布，04 客户端可通过“检查更新”发现并下载对应安装包。每个 EXE／ZIP 独立下载，不使用 Actions 的四合一下载包。04 客户端下载后仍需关闭归屿并运行安装包。');
          body=body.replace('供用户测试的预发布版本：完整 Windows CI 尚未通过，请查看以下实际结果。','已正式发布，但自动安装更新回归仍因等待旧程序退出超时而未通过。此问题尚未修复；目录、拖动排序、归档、右键入口、双架构安装卸载和界面回归均通过。请查看以下实际 CI 结果，勿将正式发行状态视为所有检查通过。');
          fs.writeFileSync('/tmp/release-notes.md',body);
          JS
      - name: Publish all existing Windows 06 packages as formal
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=false --notes-file /tmp/release-notes.md
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > /tmp/promoted.json
          node - <<'JS'
          const before=require('/tmp/release.json'),after=require('/tmp/promoted.json');
          if(after.draft||after.prerelease)throw Error('Windows 06 is not formal');
          if(JSON.stringify(before.assets.map(a=>[a.id,a.digest,a.size]).sort())!==JSON.stringify(after.assets.map(a=>[a.id,a.digest,a.size]).sort()))throw Error('Release assets changed unexpectedly');
          console.log('PASS: Windows 06 formal, all four assets and checksums unchanged');
          JS
