name: Windows x64 test package
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Windows validation run containing the test candidate
        required: true
        default: '41413401220'
  push:
    paths: ['.github/workflows/windows-test-package.yml']
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Guiyu-Windows
          path: candidate
          run-id: ${{ inputs.source_run_id || '41413401220' }}
          github-token: ${{ github.token }}
      - name: Verify the single x64 installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem candidate -Recurse -Filter '*-Windows-x64-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one x64 installer' }
          $file = $files[0]
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "Test candidate only; full validation is not complete." >> $env:GITHUB_STEP_SUMMARY
          "$($file.Name) — $($file.Length) bytes — SHA256 $hash" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Guiyu-Windows-x64-installer-test
          path: candidate/**/*-Windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
