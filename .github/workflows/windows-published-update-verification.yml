name: Verify published Windows update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-published-update-verification.yml', 'Windows/tests/published-update.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        arch: [ia32, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - run: npm ci --omit=optional --ignore-scripts
        working-directory: Windows
      - name: Verify the complete installer with the new downloader
        env:
          GH_TOKEN: ${{ github.token }}
          GUIYU_UPDATE_BASELINE: windows-20261102-08
          GUIYU_UPDATE_TARGET: latest
          GUIYU_UPDATE_DOWNLOAD_ONLY: '1'
        run: node Windows/tests/published-update.cjs ${{ matrix.arch }}
