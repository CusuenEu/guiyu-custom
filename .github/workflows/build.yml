name: Build and self-test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and isolated self-tests
        run: ./build.sh
      - name: Verify embedded framework and signature
        run: codesign --verify --deep --strict dist/归屿.app
