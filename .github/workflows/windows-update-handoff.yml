name: Windows update process handoff
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-update-handoff.yml'
      - 'Windows/src/install-update.cjs'
      - 'Windows/scripts/update-install.ps1'
      - 'Windows/tests/update-native*.cjs'
permissions:
  contents: read
jobs:
  handoff:
    runs-on: windows-2022
    env:
      GUIYU_NATIVE_ARCHES: x64
      GUIYU_NATIVE_ASSET_PREFIX: Guiyu-20261102-06
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - run: npm ci --omit=optional --ignore-scripts
        working-directory: Windows
      - name: Download the published Windows 06 runtime and installer
        shell: pwsh
        run: |
          gh release download windows-20261102-06 --repo $env:GITHUB_REPOSITORY --pattern '*-Windows-x64.zip' --pattern '*-Windows-x64-setup.exe' --dir Windows/out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath Windows/out/Guiyu-20261102-06-Windows-x64.zip -DestinationPath Windows/out
      - name: Published 06 control (known shutdown regression)
        continue-on-error: true
        run: node Windows/tests/update-native.cjs
        env:
          GUIYU_UPDATE_TEST_SOURCE: '0'
      - name: Current updater must install and restart through the same real installer
        run: node Windows/tests/update-native.cjs
        env:
          GUIYU_UPDATE_TEST_SOURCE: '1'
